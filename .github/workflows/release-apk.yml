# 推送 v* 标签后自动构建 APK 并发布到 GitHub Releases。
# 源码仓库：UESTC-EAMS-Helper；Release 目标：UESTC-EAMS-Helper-App（与应用内更新检查一致）。
#
# 一次性配置：在源码仓库 Settings → Secrets → Actions 添加
#   RELEASE_REPO_TOKEN = 对 UESTC-EAMS-Helper-App 有 repo 权限的 PAT
#   UPLOAD_KEYSTORE_BASE64 / UPLOAD_STORE_PASSWORD / UPLOAD_KEY_PASSWORD / UPLOAD_KEY_ALIAS
#   见仓库根目录 keystore.properties.example
#
# 日常发布：
#   1. 改 app/build.gradle.kts 的 versionCode / versionName
#   2. git commit && git push origin master
#   3. git tag v1.1.0 && git push origin v1.1.0
# 或在 Actions 页手动 Run workflow，填写 tag 与说明。

name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag，例如 v1.1.0"
        required: true
        type: string
      notes:
        description: "Release 说明，可留空"
        required: false
        type: string

concurrency:
  group: release-apk-${{ github.ref_name || github.event.inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_REPOSITORY: MilLoong/UESTC-EAMS-Helper-App
      APK_PATH: app/build/outputs/apk/debug/UESTC-EAMS-Helper.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#"${TAG%%[![:space:]]*}"}"
          TAG="${TAG%"${TAG##*[![:space:]]}"}"
          if [ -z "$TAG" ]; then
            echo "::error::Release tag is empty"
            exit 1
          fi
          if ! echo "$TAG" | grep -qE '^v[0-9]'; then
            echo "::error::Tag must look like v1.0.0, got: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          GRADLE_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          GRADLE_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ "$VERSION" != "$GRADLE_NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $GRADLE_NAME in app/build.gradle.kts"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$GRADLE_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_PASSWORD (and UPLOAD_KEY_ALIAS) in Actions secrets"
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/upload.jks
          ALIAS="${KEY_ALIAS:-upload}"
          {
            echo "storeFile=signing/upload.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - name: Build debug APK
        # 用 bash 调用，避免 Windows 提交的 gradlew 在 Linux 上无 +x 导致 Permission denied
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            find app/build/outputs/apk -name '*.apk' -ls || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Check release token
        run: |
          if [ -z "${{ secrets.RELEASE_REPO_TOKEN }}" ]; then
            echo "::error::Add secret RELEASE_REPO_TOKEN with repo scope on ${{ env.RELEASE_REPOSITORY }}"
            exit 1
          fi

      - name: Write release notes file
        env:
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          {
            if [ -n "$INPUT_NOTES" ]; then
              printf '%s\n\n' "$INPUT_NOTES"
            fi
            echo "versionName ${{ steps.meta.outputs.version }}"
            echo "versionCode ${{ steps.meta.outputs.version_code }}"
            echo ""
            echo "下载 UESTC-EAMS-Helper.apk 覆盖安装。"
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPOSITORY }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          files: ${{ env.APK_PATH }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
