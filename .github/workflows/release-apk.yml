# 推送 v* 标签后自动构建 APK 并发布到 GitHub Releases。
# 源码与 Release 仓库：UESTC-EAMS-Helper-App（与应用内更新检查一致）。
#
# 一次性配置：在仓库 Settings → Secrets → Actions 添加
#   RELEASE_REPO_TOKEN = 对本仓库有 repo 权限的 PAT（也可用于跨仓发版）
#   UPLOAD_KEYSTORE_BASE64 / UPLOAD_STORE_PASSWORD / UPLOAD_KEY_ALIAS
#   见仓库根目录 keystore.properties.example
#
# 日常发布：
#   1. 改 app/build.gradle.kts 的 versionCode / versionName
#   2. git commit && git push origin master
#   3. git tag v1.1.0 && git push origin v1.1.0
# Release 说明默认汇总上一个版本标签之后的提交，手动填写 notes 时覆盖更新内容。

name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag，例如 v1.1.0"
        required: true
        type: string
      notes:
        description: "Release 说明，可留空自动使用提交记录"
        required: false
        type: string

concurrency:
  group: release-apk-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_REPOSITORY: MilLoong/UESTC-EAMS-Helper-App
      APK_PATH: app/build/outputs/apk/debug/app-debug.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#"${TAG%%[![:space:]]*}"}"
          TAG="${TAG%"${TAG##*[![:space:]]}"}"
          if [ -z "$TAG" ]; then
            echo "::error::Release tag is empty"
            exit 1
          fi
          if ! echo "$TAG" | grep -qE '^v[0-9][A-Za-z0-9._+-]*$'; then
            echo "::error::Tag must look like v1.0.0, got: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          GRADLE_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          GRADLE_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ "$VERSION" != "$GRADLE_NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $GRADLE_NAME in app/build.gradle.kts"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$GRADLE_CODE" >> "$GITHUB_OUTPUT"

      - name: Test release notes generator
        run: python3 -m unittest discover -s scripts -p test_release_notes.py -v

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Configure UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD (and UPLOAD_KEY_ALIAS) in Actions secrets"
            exit 1
          fi
          mkdir -p signing
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"
          ALIAS="$(printf '%s' "${KEY_ALIAS:-upload}" | tr -d '\r\n')"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > signing/upload.jks
          if [ ! -s signing/upload.jks ]; then
            echo "::error::upload.jks empty after base64 decode; paste UPLOAD_KEYSTORE_BASE64 as one line without spaces"
            exit 1
          fi
          KEYTOOL="${JAVA_HOME}/bin/keytool"
          if ! "$KEYTOOL" -list -keystore signing/upload.jks -storepass "$STORE_PASSWORD" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore password or alias mismatch. Use storePassword and keyAlias from local keystore.properties"
            exit 1
          fi
          {
            echo "storeFile=signing/upload.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${ALIAS}"
            echo "keyPassword=${STORE_PASSWORD}"
          } > keystore.properties

      - name: Build debug APK
        # 用 bash 调用，避免 Windows 提交的 gradlew 在 Linux 上无 +x 导致 Permission denied
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            find app/build/outputs/apk -name '*.apk' -ls || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Add secret RELEASE_REPO_TOKEN with repo scope on $RELEASE_REPOSITORY"
            exit 1
          fi

      - name: Write release notes file
        env:
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          python3 scripts/release_notes.py \
            --tag '${{ steps.meta.outputs.tag }}' \
            --version '${{ steps.meta.outputs.version }}' \
            --version-code '${{ steps.meta.outputs.version_code }}' \
            --repository "$RELEASE_REPOSITORY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPOSITORY }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          files: ${{ env.APK_PATH }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
